# =============================================================================
# extractor — deterministic website → RAG corpus pipeline
#
# Services:
#   ollama               Local LLM + embeddings on GPU (no external calls)
#   ollama-pull          One-shot container that pulls the pinned models
#   firecrawl-api        Self-hosted Firecrawl REST API (map/scrape/crawl/extract)
#   firecrawl-playwright Headless browser used by firecrawl for JS-heavy pages
#   redis                Firecrawl job queue / rate limiting
#   rabbitmq             Firecrawl job queue backend (NuQ)
#   nuq-postgres         Firecrawl job metadata store (NuQ)
#   mongo                Corpus store: docs, chunks, pages audit, run manifests
#   app                  LangGraph pipeline + web UI/API (the only published port)
#
# All configuration comes from .env — there are intentionally NO ${VAR:-default}
# fallbacks here, so a missing key fails fast instead of silently defaulting.
# =============================================================================
name: extractor

# Shared environment for Firecrawl's internal services. Points its job queue at
# redis/rabbitmq/nuq-postgres and its LLM features at the local Ollama instance.
x-firecrawl-env: &firecrawl-env
  REDIS_URL: redis://redis:6379
  REDIS_RATE_LIMIT_URL: redis://redis:6379
  PLAYWRIGHT_MICROSERVICE_URL: ${PLAYWRIGHT_MICROSERVICE_URL}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_HOST: nuq-postgres
  POSTGRES_PORT: "5432"
  # Self-hosted mode: no API key required for map/scrape/crawl/extract
  USE_DB_AUTHENTICATION: "false"
  NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE}
  CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS}
  MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS}
  # Route Firecrawl's LLM features (/extract) to local Ollama — no OpenAI
  OLLAMA_BASE_URL: http://ollama:11434
  MODEL_NAME: ${LLM_MODEL}
  MODEL_EMBEDDING_NAME: ${EMBED_MODEL}

services:
  # ---------------------------------------------------------------------------
  # Ollama — serves LLM classification (qwen2.5:14b Q4_K_M) and embeddings
  # (bge-large) on the host GPU. Internal only; app and firecrawl reach it at
  # http://ollama:11434. Requires nvidia-container-toolkit on the host.
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: extractor-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama   # model blobs persist across rebuilds
    environment:
      OLLAMA_KEEP_ALIVE: 30m          # keep models warm between classify calls
      OLLAMA_NUM_PARALLEL: "4"        # concurrent classify requests from fan-out
      OLLAMA_MAX_LOADED_MODELS: "2"   # qwen + bge-large stay resident
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "ps"]   # exits non-zero until API server is up
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------------------
  # ollama-pull — one-shot init container: pulls the models pinned in .env,
  # then exits. `app` depends on service_completed_successfully, so the pipeline
  # can never run before models exist. Safe to re-run (skips existing models).
  # ---------------------------------------------------------------------------
  ollama-pull:
    image: ollama/ollama:latest
    container_name: extractor-ollama-pull
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL}
      EMBED_MODEL: ${EMBED_MODEL}
    entrypoint: /bin/sh
    command: -c 'ollama pull "$$LLM_MODEL" && ollama pull "$$EMBED_MODEL"'

  # ---------------------------------------------------------------------------
  # firecrawl-api — self-hosted Firecrawl REST API. Internal only (no host port)
  # — the app calls /v1/map and /v1/scrape over the private network. The harness
  # command also spawns the queue workers inside this container.
  # ---------------------------------------------------------------------------
  firecrawl-api:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: extractor-firecrawl-api
    restart: unless-stopped
    ulimits:
      nofile:                         # scraping opens many sockets
        soft: 65535
        hard: 65535
    environment:
      <<: *firecrawl-env
      HOST: "0.0.0.0"
      PORT: "3002"
      EXTRACT_WORKER_PORT: "3004"
      WORKER_PORT: "3005"
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      ENV: local
    command: node dist/src/harness.js --start-docker
    depends_on:
      redis:
        condition: service_started
      firecrawl-playwright:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      nuq-postgres:
        condition: service_healthy
    healthcheck:
      # Any HTTP response means the server is up (404 is fine)
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3002/', () => process.exit(0)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s               # harness needs time to boot workers

  # ---------------------------------------------------------------------------
  # firecrawl-playwright — headless Chromium used for JS-rendered pages.
  # Hardened: drops all capabilities, no-new-privileges, tmpfs cache.
  # ---------------------------------------------------------------------------
  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service:latest
    container_name: extractor-firecrawl-playwright
    restart: unless-stopped
    environment:
      PORT: "3000"
      BLOCK_MEDIA: "true"             # skip images/fonts — faster, less bandwidth
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g

  # ---------------------------------------------------------------------------
  # stealth-playwright — anti-bot-resistant renderer. Same /scrape contract as
  # firecrawl-playwright but uses patchright (patched CDP runtime) + REAL
  # headed Google Chrome under xvfb. Slower and heavier — point
  # PLAYWRIGHT_MICROSERVICE_URL at it when a site bot-walls the stock service.
  # ---------------------------------------------------------------------------
  stealth-playwright:
    build: ./stealth-playwright
    container_name: extractor-stealth-playwright
    restart: unless-stopped
    environment:
      PORT: "3000"
      BLOCK_MEDIA: "true"
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g

  # ---------------------------------------------------------------------------
  # redis — Firecrawl's job queue + rate-limit store. Internal only.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:alpine
    container_name: extractor-redis
    restart: unless-stopped
    command: redis-server --bind 0.0.0.0

  # ---------------------------------------------------------------------------
  # rabbitmq — Firecrawl NuQ message broker. Internal only.
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: extractor-rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ---------------------------------------------------------------------------
  # mongo — corpus store (extractor.docs / .chunks / .pages / .runs).
  # Internal only: use `docker compose exec mongo mongosh ...` to query.
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: extractor-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # NOTE: -u/-p flags, NOT a URI — quoted URIs keep $VARs from expanding
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME"
          -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin
          --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 2)'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------------------
  # nuq-postgres — Firecrawl's NuQ job metadata store. Internal only.
  # ---------------------------------------------------------------------------
  nuq-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    container_name: extractor-nuq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - nuq-pg-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s

  # ---------------------------------------------------------------------------
  # app — LangGraph pipeline + FastAPI web UI.
  #
  #   * The ONLY service with a host-published port: ${APP_PORT} -> :8000
  #   * `command: serve` runs the UI; CLI runs use `docker compose run app run <url>`
  #   * Waits for: models pulled (ollama-pull exit 0), firecrawl healthy,
  #     mongo healthy — so it can never start half-ready
  #   * Volumes: corpus JSONL output -> ./data, LangGraph SQLite checkpoints
  #     -> ./checkpoints (resume runs without re-scraping)
  # ---------------------------------------------------------------------------
  app:
    build: ./app
    container_name: extractor-app
    environment:
      FIRECRAWL_API_URL: http://firecrawl-api:3002   # internal service address
      OLLAMA_BASE_URL: http://ollama:11434           # internal service address
      LLM_MODEL: ${LLM_MODEL}
      EMBED_MODEL: ${EMBED_MODEL}
      LLM_SEED: ${LLM_SEED}
      MIN_WORDS: ${MIN_WORDS}
      SCRAPE_TIMEOUT_MS: ${SCRAPE_TIMEOUT_MS}
      MAP_LIMIT: ${MAP_LIMIT}
      SITEMAP_SKIP_PATTERNS: ${SITEMAP_SKIP_PATTERNS}
      EXCLUDE_PATH_REGEX: ${EXCLUDE_PATH_REGEX}
      BATCH_SIZE: ${BATCH_SIZE}
      DATA_DIR: /data
      CHECKPOINT_DB: /checkpoints/corpus.db
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB}
    ports:
      # The only published port in the stack: the pipeline UI
      - "${APP_PORT}:8000"
    command: serve
    volumes:
      - ./data:/data
      - ./checkpoints:/checkpoints
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
      firecrawl-api:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  ollama-models:   # Ollama model blobs (~10 GB)
  nuq-pg-data:     # Firecrawl job metadata
  mongo-data:      # corpus: docs, chunks, pages, runs

# All services share one private bridge network. The ONLY host-published port
# is ${APP_PORT} on `app` (the UI). NOT `internal: true` — firecrawl needs
# outbound internet to scrape target sites and ollama-pull needs it to fetch
# models. Everything else (ollama:11434, mongo:27017, redis, rabbitmq,
# postgres, firecrawl-api:3002) is unreachable from the host.
networks:
  default:
    name: extractor-internal
    driver: bridge
